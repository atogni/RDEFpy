[project]
name = "RDEFpy"
version = "1.1.0"
description = "Reader and writer for the CCSDS Delta-DOR Raw Data Exchange Format (RDEF, CCSDS 506.1-B-1)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Togni", email = "antogni@moreheadstate.edu" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
keywords = ["CCSDS", "RDEF", "Delta-DOR", "DSN", "radio science", "open-loop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Cython",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
browse = ["matplotlib>=3.8"]  # rdefpy.browse

[project.urls]
Documentation = "https://rdefpy.readthedocs.io/en/latest/"
Repository = "https://github.com/atogni/RDEFpy"
Issues = "https://github.com/atogni/RDEFpy/issues"

[build-system]
# setuptools, not uv_build: uv_build cannot compile the Cython extension
# (src/rdefpy/prd/unpack_cyth.pyx). See setup.py.
requires = ["setuptools>=77.0", "cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdefpy = ["py.typed"]

[tool.setuptools.exclude-package-data]
# Generated C belongs in the sdist build, not the installed package.
"*" = ["*.c"]

[tool.uv]
# Rebuild the editable install when the Cython source changes, not only setup.py.
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "src/rdefpy/prd/unpack_cyth.pyx" }]

[dependency-groups]
dev = ["matplotlib>=3.8", "pytest>=8"]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
