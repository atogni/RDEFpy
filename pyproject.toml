[project]
name = "RDEFpy"
version = "0.1.0"
description = "Reader and writer for the CCSDS Delta-DOR Raw Data Exchange Format (RDEF, CCSDS 506.1-B-1)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Togni", email = "antogni@moreheadstate.edu" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
keywords = ["CCSDS", "RDEF", "Delta-DOR", "DSN", "radio science", "open-loop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Cython",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Repository = "https://github.com/atogni/RDEFpy"

[build-system]
# setuptools, not uv_build: uv_build cannot compile the Cython extension
# (src/rdefpy/prd/unpack_cyth.pyx). See setup.py.
requires = ["setuptools>=77.0", "cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
# Generated C belongs in the sdist build, not the installed package.
"*" = ["*.c"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
