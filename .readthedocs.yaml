# Read the Docs build: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"

# uv sync with the "docs" dependency group (uv.lock is respected). The
# docs only import rdefpy, so the NumPy path is enough if the Cython
# build is skipped.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
