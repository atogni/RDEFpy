name: release

on:
  push:
    tags: ["v*"]
  # Manual run from the Actions tab: builds and tests every wheel, publishes nothing.
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and aarch64 Linux, x64 Windows, Intel and Apple-silicon macOS.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          # No free-threaded (cp3xxt) wheels: those installs build the sdist.
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp315-*"
          # x64 only on Windows (no 32-bit win32 wheels): those installs build the sdist.
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_TEST_REQUIRES: pytest
          # The extension is optional in setup.py, so a failed compile would
          # still produce a wheel; refuse to ship one without it.
          CIBW_TEST_COMMAND: >-
            python -c "from rdefpy.prd import reader; assert reader._unpack_fast is not None and reader._complex_fast is not None"
            && pytest -rs {project}/tests
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the package version
        run: |
          v=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "${GITHUB_REF_NAME}" = "v$v" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
